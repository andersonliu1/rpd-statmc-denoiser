# Veach Multiple Importance Sampling Test Scene
# Classic benchmark from Eric Veach's PhD thesis
# Demonstrates MIS effectiveness with varying light sizes and material roughness

# Image settings
image_width: 1920
image_height: 1080

# Camera settings
fov: 45.0
camera_position: [0.0, 2.0, -8.0]
camera_direction: [0.0, -0.15, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 8.0

# Rendering settings
samples_per_pixel: 128
scene: veach_mis
output: veach_mis
tonemap: agx  # options: aces, agx, agx-golden, agx-punchy

# StatMC / Adaptive settings
statmc_enabled: true
rpf_tile_size: 8
rpf_target_samples: 256
rpf_max_radius: 4
rpf_shrinkage_scale: 0.0
sensitivity_match_threshold: 0.2
debug_statmc_outputs: false
color_window_radius: 3
color_normal_threshold: 0.6
color_depth_threshold: 0.2
color_compat_alpha: 0.01
color_shrinkage_k: 0.1
color_sigma_max: 4.0
var_window_radius: 3
var_normal_threshold: 0.6
var_depth_threshold: 0.25
var_compat_sigma: 3.0
var_shrinkage_k: 0.7
var_iterations: 6
adaptive_spp: 64
adaptive_base_samples: 4
adaptive_sigma_max: 4.0
adaptive_passes: 2

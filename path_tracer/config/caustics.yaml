# Image settings
image_width: 1920
image_height: 1080

# Camera settings
fov: 50.0
camera_position: [0.0, 3.5, -7.0]
camera_direction: [0.0, -0.25, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 7.5

# Rendering settings
samples_per_pixel: 512
scene: caustics
output: caustics
tonemap: agx  # options: aces, agx, agx-golden, agx-punchy

# StatMC / Adaptive settings
statmc_enabled: false
rpf_tile_size: 8
rpf_target_samples: -1  # -1 = MIN_SAMPLES fallback
rpf_max_radius: 1       # pooling radius in tiles (0 = no pooling)
rpf_shrinkage_scale: 1.0
sensitivity_match_threshold: 0.0
color_window_radius: 1        # Color window radius (pixels)
color_normal_threshold: 0.95  # dot threshold for normal gating
color_depth_threshold: 0.01   # relative depth threshold
color_shrinkage_k: 0.001      # shrinkage stabilizer
var_window_radius: 1
var_normal_threshold: 0.95
var_depth_threshold: 0.01
var_compat_sigma: 1.5
var_shrinkage_k: 0.001
var_iterations: 2
adaptive_base_samples: 0
adaptive_spp: 0
adaptive_sigma_max: 3.0
adaptive_passes: 1

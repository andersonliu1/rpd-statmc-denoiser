# Material Showcase Scene
# Displays various BRDF models: diffuse, metals, glossy, mirror
# Studio lighting setup for professional presentation

# Image settings
image_width: 1920
image_height: 1080

# Camera settings
fov: 40.0
camera_position: [0.0, 3.5, -10.0]
camera_direction: [0.0, -0.2, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 10.0

# Rendering settings
samples_per_pixel: 128
scene: material_showcase
output: material_showcase
tonemap: agx  # options: aces, agx, agx-golden, agx-punchy

# StatMC / Adaptive settings
statmc_enabled: true
rpf_tile_size: 8
rpf_target_samples: 256
rpf_max_radius: 4
rpf_shrinkage_scale: 0.0
sensitivity_match_threshold: 0.2
debug_statmc_outputs: false
color_window_radius: 3
color_normal_threshold: 0.6
color_depth_threshold: 0.2
color_compat_alpha: 0.01
color_shrinkage_k: 0.1
color_sigma_max: 4.0
var_window_radius: 3
var_normal_threshold: 0.6
var_depth_threshold: 0.25
var_compat_sigma: 3.0
var_shrinkage_k: 0.7
var_iterations: 6
adaptive_spp: 64
adaptive_base_samples: 4
adaptive_sigma_max: 4.0
adaptive_passes: 2

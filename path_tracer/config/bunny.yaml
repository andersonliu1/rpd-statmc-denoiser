# Rendering settings
image_width: 512
image_height: 512
samples_per_pixel: 4
scene: bunny
output: bunny  # saves to output/dragon unless an absolute path is provided
tonemap: agx  # options: aces, agx, agx-golden, agx-punchy

# Camera settings
fov: 38.6
camera_position: [0.278, 0.2744, -0.8]
camera_direction: [0.0, 0.0, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 0.8

# StatMC settings
statmc_enabled: true
rpf_tile_size: 16
rpf_target_samples: -1  # -1 = MIN_SAMPLES fallback
rpf_max_radius: 1       # pooling radius in tiles (0 = no pooling)
rpf_shrinkage_scale: 1.0
sensitivity_match_threshold: 0.0
color_window_radius: 3        # Color window radius (pixels)
color_normal_threshold: 0.85  # dot threshold for normal gating (lower = smoother)
color_depth_threshold: 0.05   # relative depth threshold (higher = smoother)
color_shrinkage_k: 0.0005     # shrinkage stabilizer
var_window_radius: 4
var_normal_threshold: 0.85
var_depth_threshold: 0.1
var_compat_sigma: 2.0
var_shrinkage_k: 0.001
var_iterations: 4
adaptive_spp: 2             # Total extra samples (spp) for adaptive refinement
adaptive_base_samples: 0    # Baseline extra samples per pixel for adaptive refinement
adaptive_sigma_max: 6.0     # Clamp for variance used in adaptive importance
adaptive_passes: 1          # Number of adaptive refinement passes

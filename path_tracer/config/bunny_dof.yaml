# Rendering settings
image_width: 1024
image_height: 1024
# Baseline spp (override via --spp on CLI)
samples_per_pixel: 10
scene: bunny_dof
output: bunny_dof  # saves to output/bunny_dof unless an absolute path is provided
tonemap: agx  # options: aces, agx, agx-golden, agx-punchy

# Camera settings
fov: 38.6
camera_position: [0.278, 0.2744, -0.8]
camera_direction: [0.0, 0.0, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 1.05
aperture: 0.14

# StatMC settings
statmc_enabled: true  # override with --statmc / --no-statmc
rpf_tile_size: 8
rpf_target_samples: 256  # -1 = MIN_SAMPLES fallback
rpf_max_radius: 10      # pooling radius in tiles (0 = no pooling)
rpf_shrinkage_scale: 0.0
sensitivity_match_threshold: 0.2
debug_statmc_outputs: true  # set true to dump StatMC debug HDRs
color_window_radius: 3
color_normal_threshold: 0.6
color_depth_threshold: 0.2
color_compat_alpha: 0.01
color_shrinkage_k: 0.1
color_sigma_max: 4.0
var_window_radius: 3
var_normal_threshold: 0.6
var_depth_threshold: 0.25
var_compat_sigma: 3.0
var_shrinkage_k: 0.7
var_iterations: 6
# Adaptive sampling (only used when StatMC is enabled)
adaptive_spp: 0             # Total extra samples (spp); override via --adaptive-spp
adaptive_base_samples: 0    # Baseline extra samples per pixel
adaptive_sigma_max: 6.0     # Clamp for variance used in adaptive importance
adaptive_passes: 0          # Number of adaptive refinement passes

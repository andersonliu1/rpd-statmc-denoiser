# Cornell Box with Mirror Spheres Scene
# Demonstrates global illumination, color bleeding, and reflections

# Image settings
image_width: 1024
image_height: 1024

# Camera settings
fov: 38.6
camera_position: [0.278, 0.2744, -0.8]
camera_direction: [0.0, 0.0, 1.0]
world_up: [0.0, 1.0, 0.0]
focus_distance: 0.8

# Rendering settings
samples_per_pixel: 512
scene: cornell_spheres
output: cornell_spheres
